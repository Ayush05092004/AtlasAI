services:
  postgres:
    image: postgres:16-alpine
    container_name: atlasai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlasai
      POSTGRES_PASSWORD: atlasai_dev_password
      POSTGRES_DB: atlasai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: